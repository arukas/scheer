<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scheer 配置导入 Demo</title>
    <style>
      body {
        max-width: 640px;
        margin: 40px auto;
        padding: 0 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1f2937;
      }
      label {
        display: block;
        margin: 16px 0 6px;
        font-weight: 600;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
      }
      textarea {
        min-height: 180px;
        font-family: ui-monospace, monospace;
      }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #111827;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      #log {
        margin-top: 20px;
        padding: 12px;
        background: #f3f4f6;
        border-radius: 8px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        white-space: pre-wrap;
        min-height: 60px;
      }
    </style>
  </head>
  <body>
    <h1>Scheer 配置导入 Demo</h1>
    <p>
      手工验收用页面。通过任意静态服务器以 HTTP 访问本页，例如：
      <code>npx serve sdk</code> 或 <code>python3 -m http.server -d sdk 8000</code>。
    </p>

    <label for="extensionId">Extension ID</label>
    <input id="extensionId" placeholder="例如：abcdefghijklmnopqrstuvwxyzabcdef" />

    <label for="config">待导入配置（JSON）</label>
    <textarea id="config">
{
  "server": {
    "base": "https://api.example.com",
    "secret": "sk-demo-secret-123456"
  },
  "crawl": {
    "confirm_before_submit": true
  }
}</textarea
    >

    <button id="send" type="button">发起导入请求</button>
    <div id="log"></div>

    <script type="module">
      import { requestExtensionConfigImport } from './extension-import.js';

      const log = (text) => {
        document.getElementById('log').textContent +=
          `${new Date().toLocaleTimeString()}  ${text}\n`;
      };

      document.getElementById('send').addEventListener('click', async () => {
        const extensionId = document.getElementById('extensionId').value.trim();
        let config;
        try {
          config = JSON.parse(document.getElementById('config').value);
        } catch {
          log('配置 JSON 解析失败');
          return;
        }

        log(`发起导入请求 → ${extensionId}`);
        try {
          const result = await requestExtensionConfigImport({ extensionId, config });
          log(`扩展已接收请求（requestId: ${result.requestId}），请在扩展确认窗口中操作`);
        } catch (err) {
          log(`失败：${err.message}`);
        }
      });
    </script>
  </body>
</html>
